name: todo_smart
description: "A to-do list app that gamifies your tasks."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  google_fonts: ^6.1.0
  go_router: ^13.0.1
  percent_indicator: ^4.2.3
  flutter_background_service: ^5.0.1
  shared_preferences: ^2.2.2
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1
  window_manager: ^0.3.7
  app_settings: ^5.1.1
  flutter_local_notifications: ^16.3.0
  package_info_plus: ^5.0.1
  app_usage: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
